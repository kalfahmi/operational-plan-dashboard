<style>
:root{--g:#0f5f4c;--g2:#dcebdf;--gold:#b8901c;--gold2:#f6e8bd;--ink:#26231b;--mut:#6f6650;--line:#e6d9bb;--bg:#f4ead4;--card:#fbf6e9;--done:#1b7f4b;--on:#2a78d6;--sup:#d98e00;--bad:#cc3b3b;--later:#8a9490}
*{box-sizing:border-box}
body{margin:0;font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6}
header{background:linear-gradient(120deg,#0b4b3c 0%,#13806a 55%,#d4a82a 140%);color:#fff;padding:18px 20px 0;position:relative;overflow:hidden}header:before,header:after{content:'';position:absolute;border-radius:50%;background:rgba(255,255,255,.08);animation:fl 9s ease-in-out infinite}header:before{width:220px;height:220px;left:-60px;top:-90px}header:after{width:140px;height:140px;left:30%;bottom:-70px;animation-delay:-4s}.hw{position:relative;z-index:1}@keyframes fl{50%{transform:translateY(14px) scale(1.06)}}
.hw{max-width:1120px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
h1{font-size:22px;margin:0;font-weight:700}
.sub{font-size:13px;opacity:.85}
.badge{background:rgba(255,255,255,.14);border-radius:8px;padding:6px 12px;font-size:13px;text-align:center}
nav{display:flex;gap:4px;margin-top:14px;overflow-x:auto}

main{max-width:1120px;margin:0 auto;padding:18px 20px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:12px}
.kpi{position:relative;overflow:hidden;color:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 4px 14px rgba(80,60,20,.15);transition:transform .25s}.kpi:hover{transform:translateY(-4px) rotate(-.4deg)}
.kpi b{display:block;font-size:32px;line-height:1.2;font-weight:700}
.kpi span.lb{font-size:13px;opacity:.95}.kpi small{font-size:15px;opacity:.85}.kpi .gl{position:absolute;left:10px;top:4px;font-style:normal;font-size:46px;opacity:.22}
.k0{background:linear-gradient(135deg,#0f5f4c,#2a9d7f)}.k1{background:linear-gradient(135deg,#1b7f4b,#3dbb72)}.k2{background:linear-gradient(135deg,#2a78d6,#5aa2f0)}.k3{background:linear-gradient(135deg,#b36b00,#e0a020)}.k4{background:linear-gradient(135deg,#7c6f55,#a99b7a)}

.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}

.row{display:flex;align-items:center;gap:10px}
.pill{display:inline-block;padding:1px 10px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap}

.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-bottom:10px}
.rv{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.rv.lock{opacity:.55}
.note{font-size:13px;color:var(--mut)}

function dtc(v,attr,dis){const m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(normD(v)||'')||[];const d=m[3]?+m[3]:0,mo=m[2]?+m[2]:0,y=m[1]?+m[1]:1448;return `<div class="dt" ${attr}><select ${dis}><option value="">اليوم</option>${Array.from({length:30},(_,i)=>`<option value="${i+1}" ${d==i+1?'selected':''}>${A(i+1)}</option>`).join('')}</select><select ${dis}><option value="">الشهر</option>${HM.map((n,i)=>`<option value="${i+1}" ${mo==i+1?'selected':''}>${n}</option>`).join('')}</select><select ${dis}>${[1447,1448,1449,1450].map(x=>`<option value="${x}" ${y==x?'selected':''}>${A(x)} هـ</option>`).join('')}</select></div>`}
D.P.forEach(p=>{p.r.forEach(r=>{if(r.d)r.d=normD(r.d)});p.fx=p.fx||{};if(p.fx.d)p.fx.d=normD(p.fx.d)});
const ST={d:['منجز','s-d','var(--done)'],o:['وفق الخطة','s-o','var(--on)'],s:['يحتاج دعمًا','s-s','var(--sup)'],b:['متعثر','s-b','var(--bad)'],l:['لم يحن موعده','s-l','var(--later)']};
const root=document.getElementById('root'),modal=document.getElementById('modal'),sv=document.getElementById('sv');
let tab='dash',fg=0,fs='',q='',dirty=false,art=null;
const cur=p=>{let v=0;p.r.forEach(r=>{if(r.p!=null&&r.p!=='')v=+r.p});return v};
const stat=p=>{const c=cur(p);if(c>=90)return'd';if(p.later&&c===0)return'l';if(c>=p.planned)return'o';if(c>=p.planned*.7)return's';return'b'};
const pill=p=>{const s=ST[stat(p)];return `<span class="pill ${s[1]}">${s[0]}</span>`};
const GC=['#0f5f4c','#2a78d6','#d9822b','#8a4fc2','#d14a6f','#1b9aaa','#6b8e23','#c94f2d','#3b6fd1','#a8801a'];
const bar=(v,c)=>`<div class="bar"><i data-w="${v}" style="width:0;${c?'background:'+c:''}"></i></div>`;
function anim(){requestAnimationFrame(()=>requestAnimationFrame(()=>{document.querySelectorAll('.bar i[data-w]').forEach(i=>i.style.width=i.dataset.w+'%');if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;document.querySelectorAll('.cnt').forEach(e=>{const v=+e.dataset.v,s=e.dataset.suf||'',t0=performance.now();const f=t=>{const k=Math.min(1,(t-t0)/900);e.textContent=A(Math.round(v*(1-Math.pow(1-k,3))))+s;if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}))}
function mark(){dirty=true;sv.style.display='block'}
function goalAvg(g){const a=D.P.filter(p=>p.g==g);return Math.round(a.reduce((s,p)=>s+cur(p),0)/a.length)}
function counts(){const c={d:0,o:0,s:0,b:0,l:0};D.P.forEach(p=>c[stat(p)]++);return c}
function avg(){return Math.round(D.P.reduce((s,p)=>s+cur(p),0)/D.P.length)}

function dash(){
 const c=counts(),tot=D.P.length;
 let off=0,R=52,C=2*Math.PI*R,arcs='';
 ['d','o','s','b','l'].forEach(k=>{if(!c[k])return;const len=c[k]/tot*C;arcs+=`<circle cx="70" cy="70" r="${R}" fill="none" stroke="${ST[k][2]}" stroke-width="18" stroke-dasharray="${len-2} ${C-len+2}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=len});
 let dn=D.P.filter(p=>stat(p)=='d');
 let h=`<div class="grid kpis">
 <div class="kpi k0"><i class="gl">◔</i><b><span class="cnt" data-v="${avg()}" data-suf="٪">${A(avg())}٪</span></b><span class="lb">متوسط إنجاز الخطة</span></div>
 <div class="kpi k1"><i class="gl">✓</i><b><span class="cnt" data-v="${c.d}">${A(c.d)}</span><small> / ${A(tot)}</small></b><span class="lb">برامج منجزة</span></div>
 <div class="kpi k2"><i class="gl">➜</i><b><span class="cnt" data-v="${c.o}">${A(c.o)}</span></b><span class="lb">وفق الخطة</span></div>
 <div class="kpi k3"><i class="gl">⚑</i><b><span class="cnt" data-v="${c.s+c.b}">${A(c.s+c.b)}</span></b><span class="lb">تحتاج دعمًا أو متعثرة</span></div>
 <div class="kpi k4"><i class="gl">⏳</i><b><span class="cnt" data-v="${c.l}">${A(c.l)}</span></b><span class="lb">لم يحن موعدها</span></div></div>
 ${dn.length?`<div class="card cele"><b>إنجازات تستحق التهنئة</b><div>${dn.map(p=>`<span class="star">${p.name}</span>`).join('')}</div></div>`:''}
 <div class="grid two"><div class="card"><h3>حالة البرامج</h3><div class="row" style="gap:18px;flex-wrap:wrap">
 <svg class="dn" width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="توزيع حالات البرامج">${arcs}<text x="70" y="68" text-anchor="middle" font-size="26" font-weight="700" fill="#26231b" font-family="Tajawal">${A(tot)}</text><text x="70" y="88" text-anchor="middle" font-size="12" fill="#6f6650" font-family="Tajawal">برنامجًا</text></svg>
 <div style="flex:1;min-width:150px">${Object.keys(ST).map(k=>`<div class="row" style="margin:4px 0;cursor:pointer" data-fs="${k}"><i style="width:10px;height:10px;border-radius:3px;background:${ST[k][2]}"></i><span style="flex:1">${ST[k][0]}</span><b>${A(c[k])}</b></div>`).join('')}</div></div>
 <p class="note" style="margin:10px 0 0">اضغط على أي حالة لعرض برامجها.</p></div>
 <div class="card"><h3>الإنجاز حسب الهدف العام</h3>${D.goals.map((n,i)=>{const v=goalAvg(i+1);return `<div style="cursor:pointer;margin-bottom:9px" data-fg="${i+1}"><div class="row" style="justify-content:space-between;font-size:13px"><span><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:${GC[i]};margin-left:6px"></i>${A(i+1)}. ${n}</span><b>${A(v)}٪</b></div>${bar(v,GC[i])}</div>`}).join('')}</div></div>
 <div class="card" style="margin-top:12px"><h3>مسار الإنجاز بالمراجعات</h3><div class="grid" style="grid-template-columns:repeat(4,minmax(0,1fr))">${D.reviewLabels.map((l,i)=>{const f=D.P.filter(p=>p.r[i]&&p.r[i].p!=null&&p.r[i].p!=='');const a=f.length?Math.round(f.reduce((s,p)=>s+ +p.r[i].p,0)/f.length):null;return `<div style="text-align:center"><div style="font-size:12px;color:var(--mut)">${l}</div><div style="font-size:24px;font-weight:700;color:${a==null?'var(--later)':'var(--g)'}">${a==null?'—':A(a)+'٪'}</div><div class="note">${A(f.length)} برنامجًا مرصودًا</div></div>`}).join('')}</div></div>`;
 return h}

function progs(){
 let list=D.P.filter(p=>(!fg||p.g==fg)&&(!fs||stat(p)==fs)&&(!q||p.name.includes(q)||p.owner.includes(q)));
 let h=`<div class="chips">${[['','الكل'],['d','منجز'],['o','وفق الخطة'],['s','يحتاج دعمًا'],['b','متعثر'],['l','لم يحن موعده']].map(c=>`<button class="chip ${fs===c[0]?'on':''}" data-fs="${c[0]}">${c[1]}</button>`).join('')}
 <select id="gsel" style="width:auto"><option value="0">كل الأهداف</option>${D.goals.map((n,i)=>`<option value="${i+1}" ${fg==i+1?'selected':''}>${A(i+1)}. ${n}</option>`).join('')}</select>
 <input id="qin" placeholder="ابحث باسم البرنامج أو المسؤول" value="${q}" style="width:220px"></div>
 <div class="card sc"><table><thead><tr><th>م</th><th>البرنامج</th><th>الهدف</th><th>المسؤول</th><th>زمن التنفيذ</th><th style="min-width:130px">الإنجاز</th><th>الحالة</th></tr></thead><tbody>
 ${list.map(p=>`<tr class="cl" data-p="${p.n}"><td>${A(p.n)}</td><td><b>${p.name}</b></td><td>${A(p.sub)}</td><td style="font-size:13px">${p.owner}</td><td style="font-size:13px">${p.time}</td><td><div class="row"><div style="flex:1">${bar(cur(p),ST[stat(p)][2])}</div><span style="font-size:13px;width:36px">${A(cur(p))}٪</span></div></td><td>${pill(p)}</td></tr>`).join('')||'<tr><td colspan="7" class="note">لا توجد برامج بهذا الاختيار.</td></tr>'}
 </tbody></table></div><p class="note">${A(list.length)} من ${A(D.P.length)} برنامجًا · اضغط على البرنامج لعرض بطاقته وتحديث مراجعاته.</p>`;
 return h}

const SYM=['','✓','◑','✗','←','—'];
function monthly(){
 let h=`<div class="card" style="margin-bottom:12px"><div class="row" style="flex-wrap:wrap;gap:16px;font-size:13px"><b>الرموز:</b><span class="m1">✓ نُفِّذ كما خُطِّط</span><span class="m2">◑ نُفِّذ جزئيًا</span><span class="m3">✗ تعثَّر</span><span class="m4">← أُجِّل</span><span class="m5">— غير مجدول</span><span class="note">اضغط على الخانة لتبديل الرمز</span></div></div>
 <div class="card sc"><table><thead><tr><th>م</th><th>البرنامج</th>${D.months.map(m=>`<th style="text-align:center;font-size:11px">${m}</th>`).join('')}</tr></thead><tbody>
 ${D.P.map(p=>{p.m=p.m||Array(11).fill(0);return `<tr><td>${A(p.n)}</td><td style="white-space:nowrap">${p.name}</td>${p.m.map((v,i)=>`<td style="padding:3px"><div class="mc m${v}" data-c="${p.n}:${i}">${SYM[v]||'·'}</div></td>`).join('')}</tr>`}).join('')}
 <tr><td></td><td><b>المخطط (من الخطة)</b></td>${D.planned.map(v=>`<td style="text-align:center">${A(v)}</td>`).join('')}</tr>
 <tr><td></td><td><b>المنفذ ✓</b></td>${D.months.map((_,i)=>`<td style="text-align:center">${A(D.P.filter(p=>(p.m||[])[i]==1).length)}</td>`).join('')}</tr>
 <tr><td></td><td><b>جزئي ◑</b></td>${D.months.map((_,i)=>`<td style="text-align:center;color:var(--sup)">${A(D.P.filter(p=>(p.m||[])[i]==2).length)}</td>`).join('')}</tr>
 <tr><td></td><td><b>المتعثر ✗</b></td>${D.months.map((_,i)=>`<td style="text-align:center;color:var(--bad)">${A(D.P.filter(p=>(p.m||[])[i]==3).length)}</td>`).join('')}</tr>
 <tr><td></td><td><b>نسبة الإنجاز</b></td>${D.months.map((_,i)=>{const e=D.P.filter(p=>(p.m||[])[i]==1).length;return `<td style="text-align:center;font-weight:700">${A(Math.round(e/D.planned[i]*100))}٪</td>`}).join('')}</tr>
 </tbody></table></div>`;
 return h}

function stalled(){
 const l=D.P.filter(p=>['s','b'].includes(stat(p)));
 const up=D.P.filter(p=>stat(p)=='l');
 let h=`<div class="card" style="margin-bottom:12px"><h3>البرامج المتعثرة والتي تحتاج دعمًا (${A(l.length)})</h3>`;
 if(!l.length)h+=`<p class="note" style="margin:0">لا توجد برامج متعثرة حاليًا. تُحسب الحالة بمقارنة المتحقق بالمطلوب بلوغه حتى المراجعة، ويمكن تعديله من بطاقة البرنامج.</p>`;
 else h+=`<div class="sc"><table><thead><tr><th>البرنامج</th><th>المتحقق</th><th>المطلوب</th><th>سبب التعثر</th><th>الإجراء التصحيحي</th><th>موعد الإنجاز</th><th>الحالة</th></tr></thead><tbody>${l.map(p=>{p.fx=p.fx||{};return `<tr class="cl" data-p="${p.n}"><td><b>${p.name}</b></td><td>${A(cur(p))}٪</td><td>${A(p.planned)}٪</td><td>${p.fx.c||'—'}</td><td>${p.fx.a||'—'}</td><td>${fmtD(p.fx.d)}</td><td>${pill(p)}</td></tr>`}).join('')}</tbody></table></div>`;
 h+=`</div><div class="card"><h3>برامج قادمة لم يحن موعدها (${A(up.length)})</h3><div class="sc"><table><thead><tr><th>البرنامج</th><th>زمن التنفيذ</th><th>المسؤول</th><th>الإجراء التحضيري</th></tr></thead><tbody>${up.map(p=>`<tr class="cl" data-p="${p.n}"><td><b>${p.name}</b></td><td>${p.time}</td><td style="font-size:13px">${p.owner}</td><td style="font-size:13px">${p.r[0].im||'—'}</td></tr>`).join('')}</tbody></table></div></div>`;
 return h}

function reportText(){
 const c=counts();
 let t=`تقرير المراجعة الفصلية للخطة التشغيلية\nابتدائية عروة بن الزبير – العام الدراسي ١٤٤٨ – ١٤٤٩ هـ\n\n`;
 t+=`أولًا: المؤشرات العامة\n• متوسط إنجاز الخطة: ${A(avg())}٪\n• عدد البرامج: ${A(D.P.length)} — منجزة: ${A(c.d)}، وفق الخطة: ${A(c.o)}، تحتاج دعمًا: ${A(c.s)}، متعثرة: ${A(c.b)}، لم يحن موعدها: ${A(c.l)}\n\n`;
 t+=`ثانيًا: الإنجاز حسب الأهداف العامة\n`+D.goals.map((n,i)=>`• ${A(i+1)}. ${n}: ${A(goalAvg(i+1))}٪`).join('\n')+`\n\n`;
 t+=`ثالثًا: البرامج المنجزة\n`+(D.P.filter(p=>stat(p)=='d').map(p=>`• ${p.name}`).join('\n')||'• لا يوجد')+`\n\n`;
 const w=D.P.filter(p=>['s','b'].includes(stat(p)));
 t+=`رابعًا: البرامج التي تحتاج دعمًا أو المتعثرة\n`+(w.map(p=>`• ${p.name} (${A(cur(p))}٪) — ${(p.fx&&p.fx.a)||'يُحدَّد الإجراء التصحيحي'}`).join('\n')||'• لا يوجد')+`\n\n`;
 t+=`خامسًا: إجراءات التحسين المقترحة للمرحلة القادمة\n`+D.P.filter(p=>stat(p)=='o'&&cur(p)>0).map(p=>`• ${p.name}: ${p.r.filter(r=>r.im).slice(-1)[0].im}`).join('\n')+`\n\nإعداد: أ. خالد الزهراني          مدير المدرسة: د. محمد عبده الربعي`;
 return t}
function report(){return `<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h3 style="margin:0">التقرير الفصلي (يُبنى تلقائيًا من البيانات)</h3><button id="cp" class="pri">نسخ التقرير</button></div><pre id="rp">${reportText()}</pre></div>`}

function openP(n){
 const p=D.P.find(x=>x.n==n);p.fx=p.fx||{};
 const ro=!art;
 const dis=ro?'disabled':'';
 modal.innerHTML=`<div class="ov" id="ov"><div class="dlg">
 <div class="row" style="justify-content:space-between;align-items:flex-start"><div><div class="note">بطاقة متابعة برنامج (${A(p.n)}) · الهدف العام ${A(p.g)} · ${A(p.sub)}</div><h2 style="margin:0;font-size:20px">${p.name}</h2></div><button id="cl">إغلاق</button></div>
 <div class="row" style="margin:12px 0"><div style="flex:1">${bar(cur(p),ST[stat(p)][2])}</div><b>${A(cur(p))}٪</b><span id="pp">${pill(p)}</span></div>
 <div class="f2"><div><div class="fl">الهدف العام</div>${D.goals[p.g-1]}</div><div><div class="fl">زمن التنفيذ</div>${p.time}</div><div><div class="fl">المستهدفون</div>${p.target}</div><div><div class="fl">المسؤول الرئيس</div>${p.owner}</div><div><div class="fl">المسؤول المساند</div>${p.help}</div><div><div class="fl">مسؤول المتابعة</div>${p.mon}</div></div>
 <div class="f2"><div><div class="fl">مؤشر الإنجاز</div>${p.ind}</div><div><div class="fl">الشواهد المطلوبة</div>${p.ev}</div></div>
 <div class="f2"><div><div class="fl">المطلوب بلوغه حتى المراجعة الحالية (٪)</div><input type="number" min="0" max="100" id="pl" value="${p.planned}" ${dis}></div><div><div class="fl">حالة الموعد</div><select id="lt" ${dis}><option value="0" ${p.later?'':'selected'}>حان موعده</option><option value="1" ${p.later?'selected':''}>لم يحن موعده</option></select></div></div>
 <h3 style="margin-top:14px">المراجعات الدورية</h3>
 ${p.r.map((r,i)=>{const lock=i>0&&(p.r[i-1].p==null||p.r[i-1].p==='')&&(r.p==null||r.p==='');return `<div class="rv ${lock&&ro?'lock':''}"><b>${D.reviewLabels[i]}</b><div class="f2" style="margin-top:8px"><div><div class="fl">التاريخ</div>${dtc(r.d,'data-dr="'+i+'"',dis)}</div><div><div class="fl">نسبة الإنجاز ٪</div><input type="number" min="0" max="100" data-r="${i}" data-k="p" value="${r.p==null?'':r.p}" ${dis}></div></div><div class="fl">ما تم تنفيذه</div><textarea data-r="${i}" data-k="do" ${dis}>${r.do||''}</textarea><div class="f2" style="margin-top:8px"><div><div class="fl">المعوقات</div><textarea data-r="${i}" data-k="ob" ${dis}>${r.ob||''}</textarea></div><div><div class="fl">إجراءات التحسين</div><textarea data-r="${i}" data-k="im" ${dis}>${r.im||''}</textarea></div></div></div>`}).join('')}
 <h3>سجل التعثر والإجراء التصحيحي</h3><div class="f2"><div><div class="fl">سبب التعثر</div><textarea data-x="c" ${dis}>${p.fx.c||''}</textarea></div><div><div class="fl">الإجراء التصحيحي</div><textarea data-x="a" ${dis}>${p.fx.a||''}</textarea></div><div><div class="fl">موعد الإنجاز</div>${dtc(p.fx.d,'data-dx="d"',dis)}</div></div>
 
 </div></div>`;
 const close=()=>{modal.innerHTML='';render()};
 anim();document.getElementById('cl').onclick=close;
 document.getElementById('ov').onclick=e=>{if(e.target.id=='ov')close()};
 const upd=()=>{document.getElementById('pp').innerHTML=pill(p)};
 modal.querySelectorAll('[data-r]').forEach(el=>el.oninput=()=>{const r=p.r[el.dataset.r],k=el.dataset.k;r[k]=k=='p'?(el.value===''?null:Math.max(0,Math.min(100,+el.value))):el.value;mark();upd()});
 modal.querySelectorAll('[data-x]').forEach(el=>el.oninput=()=>{p.fx[el.dataset.x]=el.value;mark()});
 modal.querySelectorAll('.dt').forEach(w=>w.onchange=()=>{const q=w.querySelectorAll('select'),dv=q[0].value,mv=q[1].value,v=dv&&mv?q[2].value+'-'+mv.padStart(2,'0')+'-'+dv.padStart(2,'0'):'';if(w.dataset.dr!==undefined)p.r[w.dataset.dr].d=v;else p.fx.d=v;mark()});
 document.getElementById('pl').oninput=e=>{p.planned=Math.max(0,Math.min(100,+e.target.value||0));mark();upd()};
 document.getElementById('lt').onchange=e=>{p.later=+e.target.value;mark();upd()};
}

function render(){
 document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')=='#'+tab));
 root.innerHTML=({dash,progs,monthly,stalled,report}[tab]||dash)()+(art&&art.local?tools():'');
 root.querySelectorAll('[data-fs]').forEach(e=>e.onclick=()=>{fs=e.dataset.fs;fg=0;tab='progs';location.hash='progs';render()});
 root.querySelectorAll('[data-fg]').forEach(e=>e.onclick=()=>{fg=+e.dataset.fg;fs='';tab='progs';location.hash='progs';render()});
 root.querySelectorAll('tr[data-p]').forEach(e=>e.onclick=()=>openP(e.dataset.p));
 root.querySelectorAll('.mc').forEach(e=>e.onclick=()=>{if(!art)return;const[n,i]=e.dataset.c.split(':'),p=D.P.find(x=>x.n==n);p.m[i]=(p.m[i]+1)%6;mark();render()});
 anim();
 const ex=document.getElementById('ex');if(ex){ex.onclick=()=>{const b=new Blob([JSON.stringify(D)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='الخطة-التشغيلية-1448.json';a.click()};document.getElementById('im').onclick=()=>document.getElementById('imf').click();document.getElementById('imf').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{const o=JSON.parse(t);if(o&&o.P&&o.P.length==D.P.length){D.P=o.P;mark();render()}else{alert('الملف غير صالح')}}).catch(()=>{alert('تعذّرت قراءة الملف')})};document.getElementById('rs').onclick=()=>{if(confirm('سيتم مسح تعديلاتك في هذا المتصفح والعودة للبيانات الأصلية. متابعة؟')){try{localStorage.removeItem(LSK)}catch(e){}location.reload()}}}
 const g=document.getElementById('gsel');if(g)g.onchange=()=>{fg=+g.value;render()};
 const qi=document.getElementById('qin');if(qi)qi.onchange=()=>{q=qi.value.trim();render()};
 const cp=document.getElementById('cp');if(cp)cp.onclick=async()=>{try{await navigator.clipboard.writeText(document.getElementById('rp').innerText);cp.textContent='تم النسخ'}catch(e){const r=document.createRange();r.selectNodeContents(document.getElementById('rp'));const s=getSelection();s.removeAllRanges();s.addRange(r);cp.textContent='حدّد النص وانسخه'}};
}
const LSK='opd1448';
function tools(){return `<div class="card" style="margin-top:12px"><h3>إدارة البيانات</h3><p class="note" style="margin:0 0 10px">تُحفظ تعديلاتك في هذا المتصفح على هذا الجهاز. لنقلها إلى جهاز آخر صدّرها هنا ثم استوردها هناك.</p><div class="row" style="flex-wrap:wrap;gap:8px"><button id="ex">تصدير البيانات</button><button id="im">استيراد بيانات</button><input type="file" id="imf" accept=".json" style="display:none"><button id="rs">إعادة البيانات الأصلية</button></div></div>`}
function route(){const h=location.hash.slice(1);tab=['dash','progs','monthly','stalled','report'].includes(h)?h:'dash';render()}
addEventListener('hashchange',route);route();

sv.onclick=async()=>{
 if(!art)return;if(art.local){try{localStorage.setItem(LSK,JSON.stringify(D));sv.textContent='تم الحفظ في هذا المتصفح ✓';dirty=false;setTimeout(()=>{sv.style.display='none';sv.textContent='حفظ التغييرات'},1800)}catch(e){sv.textContent='تعذّر الحفظ: المتصفح يمنع التخزين'}return}sv.textContent='جارٍ الحفظ…';
 const i=SHELL.indexOf(BM)+BM.length,j=SHELL.indexOf(EM);
 const html='<!DOCTYPE html>\n'+SHELL.slice(0,i)+JSON.stringify(D).replace(/</g,'\\u003c')+SHELL.slice(j);
 try{await art.publish(html)}catch(e){sv.textContent='تعذّر الحفظ، أعد المحاولة'}
};
(async()=>{try{art=await claude.use('artifact')}catch(e){art=null}
if(!art){art={local:true};try{const sd=localStorage.getItem(LSK);if(sd){const o=JSON.parse(sd);if(o&&o.P&&o.P.length==D.P.length)D.P=o.P}}catch(e){}}
render()})();
